name: AI service tests

on:
  push:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-tests.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_test
          POSTGRES_PASSWORD: ai_test
          POSTGRES_DB: ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_test -d ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ai_test:ai_test@localhost:5432/ai_test
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: docker build -t ai-buddy-skeleton .
      - run: docker run --rm ai-buddy-skeleton python -m pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-coverage
          path: ai-service/coverage.xml
          if-no-files-found: warn
