version: '3.8'

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  ollamadata:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito}
      POSTGRES_DB: ${POSTGRES_DB:-aibuddy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d aibuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: golang:1.22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://avito:avito@postgres:5432/aibuddy?sslmode=disable
      - AI_SERVICE_URL=http://ai-service:8000
    command: go run .
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./ai-service:/app
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:4b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DATABASE_URL=postgres://avito:avito@postgres:5432/aibuddy?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - app-network

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    command: tail -f /dev/null
    depends_on:
      - backend
    networks:
      - app-network