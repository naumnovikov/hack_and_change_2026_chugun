openapi: 3.0.3
info:
  title: Chugun AI-Buddy Backend API
  description: Контракты бэкенда и мок-сервисов для хакатона Hack&Change 2026
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local & Docker Backend

paths:
  /api/chat:
    post:
      summary: JSON chat proxy to AI service (intermediate contract before SSE)
      operationId: chat
      parameters:
        - in: header
          name: X-Request-ID
          required: true
          description: New unique key for each message; reuse the same key and body on retry.
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{8,128}$'
        - in: cookie
          name: demo_chat
          description: Opaque server-generated demo conversation cookie; never a corporate identity.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: AI reply and optional sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/ChatError'
        '502':
          $ref: '#/components/responses/ChatError'
        '503':
          $ref: '#/components/responses/ChatError'
        '409':
          $ref: '#/components/responses/ChatError'
        '504':
          $ref: '#/components/responses/ChatError'

  /health:
    get:
      summary: Healthcheck сервиса
      operationId: getHealth
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/mock/access-request:
    post:
      summary: Создание заявки на доступ к системе/ресурсу
      operationId: createAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestPayload'
      responses:
        '200':
          description: Заявка успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestResponse'

  /api/mock/message:
    post:
      summary: Отправка сообщения коллеге (Сценарий "Кто на кнопке?")
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessagePayload'
      responses:
        '200':
          description: Сообщение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'

  /api/mock/employee:
    get:
      summary: Поиск сотрудника по названию сервиса (для find_employee)
      operationId: getEmployeeByService
      parameters:
        - name: service_name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные о сотруднике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'

  /api/mock/employee/{id}:
    get:
      summary: Получение карточки сотрудника по ID
      operationId: getEmployeeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные о сотруднике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'

components:
  responses:
    ChatError:
      description: JSON error with stable code; no upstream diagnostics
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000
          description: Whitespace is trimmed before checking length.
    ChatResponse:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
          minLength: 1
        sources:
          type: array
          items:
            type: object
            required: [title, url]
            properties:
              title:
                type: string
                minLength: 1
              url:
                type: string
                format: uri
                description: Absolute HTTP or HTTPS URL.
    ErrorResponse:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum: [invalid_request, ai_unavailable, ai_timeout, ai_error, ai_invalid_response, storage_unavailable, request_conflict]
        error:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    AccessRequestPayload:
      type: object
      required: [service_name]
      properties:
        service_name:
          type: string
          description: Название сервиса (Jira, Confluence и т.д.)

    AccessRequestResponse:
      type: object
      required: [ticket_id, status]
      properties:
        ticket_id:
          type: string
        status:
          type: string
        message:
          type: string

    SendMessagePayload:
      type: object
      required: [recipient_id, text]
      properties:
        recipient_id:
          type: string
        text:
          type: string

    SendMessageResponse:
      type: object
      required: [message_id, sent_at]
      properties:
        message_id:
          type: string
        sent_at:
          type: string
          format: date-time

    EmployeeResponse:
      type: object
      required: [employee_id, name, role]
      properties:
        employee_id:
          type: string
        name:
          type: string
        role:
          type: string
        mattermost_id:
          type: string
